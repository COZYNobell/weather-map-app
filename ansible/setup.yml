- hosts: ec2
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Python 3 설치 (Ubuntu 또는 Amazon Linux)
      raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          if command -v apt >/dev/null 2>&1; then
            apt update && apt install -y python3
          elif command -v yum >/dev/null 2>&1; then
            yum install -y python3
          fi
        fi

    - name: 패키지 업데이트
      apt:
        update_cache: yes
        upgrade: yes
      when: ansible_facts.os_family == "Debian"

    - name: Node.js 설치 (18.x)
      shell: curl -fsSL https://deb.nodesource.com/setup_18.x | bash - && apt install -y nodejs
      when: ansible_facts.os_family == "Debian"

    - name: Docker 설치
      apt:
        name: docker.io
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Git 설치
      apt:
        name: git
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: 프로젝트 디렉토리 생성
      file:
        path: /home/ec2-user/weather-map-app
        state: directory
        mode: '0755'

    - name: 로컬 프로젝트 복사
      synchronize:
        src: ../..
        dest: /home/ec2-user/weather-map-app
        recursive: yes
        delete: yes

    - name: .env 복사
      copy:
        src: /root/weather-map-app/.env
        dest: /home/ec2-user/weather-map-app/.env
         
    - name: Node.js 설치 (Ubuntu)
      shell: curl -fsSL https://deb.nodesource.com/setup_18.x | bash - && apt install -y nodejs
      when: ansible_facts.os_family == "Debian"

    - name: Node.js 설치 (Amazon Linux)
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
        yum install -y nodejs
      when: ansible_facts.os_family == "RedHat"

    - name: 서버 실행 (백그라운드 실행)
      shell: nohup node server.mjs > app.log 2>&1 &
      args:
        chdir: /home/ec2-user/weather-map-app

