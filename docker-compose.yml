services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    networks:
      - weather-network

  weather-app:
    image: cozynobell/weather-map-app:latest
    container_name: weather-map-app
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=mysql  # ✅ `mysql-container` 아닌 `mysql`로 연결 (Compose 서비스명)
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - weather-network
    command: sh -c "sleep 5 && node server.mjs"  # ✅ DB 대기 시간 확보

networks:
  weather-network:
    driver: bridge

