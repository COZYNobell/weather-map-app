name: Docker CI

on:
  push:
    branches: [ Project ]  # 원하는 브랜치명 (예: main)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # 현재 디렉토리에서 Docker 빌드를 진행
          push: true  # Docker Hub로 푸시
          tags: cozynobell/weather-map-app:latest
          build-args: |
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}  # GitHub Secrets에서 가져오는 환경 변수
            WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_HOST=${{ secrets.DB_HOST }}  # DB_HOST 환경 변수 추가
            DB_USER=${{ secrets.DB_USER }}  # DB_USER 환경 변수 추가
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}  # DB_PASSWORD 환경 변수 추가
            DB_NAME=${{ secrets.DB_NAME }}  # DB_NAME 환경 변수 추가
