name: CI/CD with Webhook

on:
  push:
    branches:
      - Project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧬 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: ✅ Run tests
        run: npm test

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Build and push Docker image
        run: |
          docker build -t cozynobell/weather-map-app:latest .
          docker push cozynobell/weather-map-app:latest

      - name: 🚀 Call webhook on EC2
        run: curl -X POST http://${{ secrets.EC2_IP }}:4000/webhook

